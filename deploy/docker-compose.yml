services:
  # File-backed runtime: keep exactly one replica and stop it before replacement.
  # PostgreSQL metadata does not make the data/workspace volumes shareable.
  inno-agent:
    image: inno-agent-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    expose:
      - "3000"
    # Repo-root .env (copy from .env.example); optional so the stack still starts without it.
    # Values under `environment:` below take precedence over the file.
    env_file:
      - path: ../.env
        required: false
    environment:
      INNO_CONFIG_DIR: /etc/inno-agent
      INNO_DATA_DIR: /var/lib/inno-agent/data
      INNO_SKILLS_DIR: /app/skills
      INNO_WORKSPACE_DIR: /srv/inno-workspace
      INNO_PORT: 3000
      INNO_HOST: 0.0.0.0
      # Compose publishes this unauthenticated local-mode port intentionally.
      # Use better-auth for any non-local deployment.
      INNO_ALLOW_UNAUTHENTICATED_NETWORK: "true"
      # DATABASE_URL: postgresql://inno:inno@postgres:5432/inno
      # Workspace files live in the stack's MinIO (manifest rows stay in
      # PostgreSQL once auth is on). SDK calls use the internal endpoint;
      # presigned upload/download URLs are issued against the host-published
      # port so the browser can reach them.
      INNO_OBJECT_STORAGE_PROVIDER: s3
      INNO_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      INNO_OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      INNO_OBJECT_STORAGE_REGION: us-east-1
      INNO_OBJECT_STORAGE_BUCKET: inno
      INNO_OBJECT_STORAGE_ACCESS_KEY_ID: inno
      INNO_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-inno-minio-secret-change-me}
      INNO_OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../runtime/config:/etc/inno-agent
      - ../runtime/data:/var/lib/inno-agent/data
      # Global skills come from the image (/app/skills). For skill development,
      # mount a live dir instead, e.g. ../runtime/skills:/app/skills
      - ../workspace:/srv/inno-workspace
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Web UI + reverse proxy: the only service published to the host.
  frontend:
    image: inno-agent-frontend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_URL: http://inno-agent:3000
    depends_on:
      inno-agent:
        condition: service_healthy

  # ParadeDB (PostgreSQL 17 + vector/pg_trgm/pg_search): the tenant schema and
  # L2/L3 memory layers require BM25 search, which stock postgres lacks.
  postgres:
    image: paradedb/paradedb:v0.22.2-pg17
    environment:
      POSTGRES_USER: inno
      POSTGRES_PASSWORD: inno
      POSTGRES_DB: inno
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inno -d inno"]
      interval: 2s
      timeout: 2s
      retries: 20

  # S3-compatible object store for workspace files. Docker Hub's minio/minio
  # images are gone since upstream went source-only; pgsty/minio is the
  # Pigsty-maintained community build of the same AGPL MinIO.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: inno
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-inno-minio-secret-change-me}
    # The API port is published on localhost so browser presigned URLs
    # (INNO_OBJECT_STORAGE_PUBLIC_ENDPOINT) resolve. Keep it loopback-only.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20

  # One-shot bucket bootstrap. Reuses the backend image — its node_modules
  # already carry @aws-sdk/client-s3, so no mc image is needed.
  minio-init:
    image: inno-agent-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    working_dir: /app/apps/inno-agent
    entrypoint:
      - node
      - -e
      - |
        const { S3Client, CreateBucketCommand } = require("@aws-sdk/client-s3");
        const s3 = new S3Client({ endpoint: "http://minio:9000", region: "us-east-1", forcePathStyle: true,
          credentials: { accessKeyId: "inno", secretAccessKey: process.env.MINIO_ROOT_PASSWORD } });
        s3.send(new CreateBucketCommand({ Bucket: "inno" }))
          .catch((e) => { if (!/AlreadyOwnedByYou|AlreadyExists/.test(e && e.name || "")) throw e; })
          .then(() => console.log("minio bucket ready"));
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-inno-minio-secret-change-me}
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
